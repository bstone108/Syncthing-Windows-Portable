name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Test and build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Windows time zone data for the version helper
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --disable-pip-version-check tzdata

      - name: Version helper self-test
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/next-date-build-version.py --self-test

      - name: Python contract tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tests/test_contracts.py

      - name: .NET contract tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project tests/PortableSyncthing.ContractTests

      - name: Release build
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build src/PortableSyncthing.Windows/PortableSyncthing.Windows.csproj -c Release

      # App bits only. scripts/package-windows.ps1 downloads the Fixed Version
      # WebView2 runtime when it builds a date.build zip, which this job does not.
      - name: Unsigned publish (CI sha, not a date.build release)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet publish src/PortableSyncthing.Windows/PortableSyncthing.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=0.0.0 -p:InformationalVersion=ci-${{ github.sha }} -p:IncludeSourceRevisionInInformationalVersion=false -o "${{ runner.temp }}/portable-syncthing-ci"
          $publish = "${{ runner.temp }}/portable-syncthing-ci"
          if (-not (Test-Path -LiteralPath "$publish/PortableSyncthing.exe")) {
            throw "CI publish did not produce PortableSyncthing.exe"
          }
          $looseDlls = @(Get-ChildItem -LiteralPath $publish -Filter *.dll -File)
          if ($looseDlls.Count -gt 0) {
            throw "Single-file publish left native DLLs beside PortableSyncthing.exe: $($looseDlls.Name -join ', ')."
          }
          if (Test-Path -LiteralPath "$publish/runtimes") {
            throw "Single-file publish left a runtimes directory beside PortableSyncthing.exe."
          }
          $support = Join-Path $publish "support"
          New-Item -ItemType Directory -Force -Path $support | Out-Null
          Get-ChildItem -LiteralPath $publish -Force | Where-Object { $_.Name -ne "PortableSyncthing.exe" -and $_.Name -ne "support" } | ForEach-Object {
            Move-Item -LiteralPath $_.FullName -Destination (Join-Path $support $_.Name)
          }
          $top = @((Get-ChildItem -LiteralPath $publish -Force | Select-Object -ExpandProperty Name | Sort-Object) -join ",")
          if ($top -ne "PortableSyncthing.exe,support") {
            throw "CI publish folder must contain only PortableSyncthing.exe and support. Found: $top"
          }

      - name: Upload CI publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: PortableSyncthing-ci-${{ github.sha }}-win-x64
          path: ${{ runner.temp }}/portable-syncthing-ci/
          if-no-files-found: error
